[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "node-walk"
dynamic = ["version"]
description = "Semantic code intelligence — local-first graph of your codebase for humans and LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeGraph Contributors" }]
keywords = ["code-analysis", "semantic-graph", "developer-tools", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
node-walk = "node_walk.cli.main:app"
nodewalk = "node_walk.cli.main:app"
node_walk = "node_walk.cli.main:app"

[tool.hatch.version]
path = "src/node_walk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/node_walk"]

[tool.hatch.build.targets.wheel.shared-data]
# Include all static web assets in the installed package
"src/node_walk/web" = "node_walk/web"

[tool.hatch.build.targets.wheel.force-include]
"src/node_walk/web/index.html" = "node_walk/web/index.html"
"src/node_walk/web/style.css"  = "node_walk/web/style.css"
"src/node_walk/web/app.js"     = "node_walk/web/app.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

